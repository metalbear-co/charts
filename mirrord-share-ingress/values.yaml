# Namespace the share-ingress runs in. Install it before the first preview, since your ingress,
# DNS, and TLS point at its Service. Local share links (`mirrord exec --share`) need it too.
namespace: mirrord
createNamespace: false

shareIngress:
  # Domain that share hosts live under, entered without a leading "*." wildcard.
  # Must match `operator.shareIngress.shareDomain` on the operator, which mints hosts under it.
  shareDomain: ""
  # Where visitors are redirected when a share host no longer resolves to a live preview or
  # local session.
  # Required while `notFound.redirect` is true.
  appDomain: ""
  notFound:
    # When true, a share host without a live preview or local session gets a 404 page that
    # redirects to `appDomain` after five seconds. When false, it gets a plain "Preview not
    # found" 404 page with no refresh and no JavaScript, and `appDomain` is not needed.
    redirect: true

server:
  image: ghcr.io/metalbear-co/operator
  # Image tag. Defaults to the chart's appVersion.
  tag: ""
  # Upgrade every replica before people use local share links: the operator's capability check
  # reaches only one replica through the Service.
  replicas: 1
  # Port the share-ingress HTTP server listens on. TLS is terminated by your ingress in front of it.
  port: 8080
  # `share_ingress=debug` also logs the upstream address each share link request is forwarded to.
  logLevel: share_ingress=info,mirrord=info,warn
  jsonLog: true
  imagePullPolicy: IfNotPresent
  imagePullSecrets: []
  podLabels: {}
  podAnnotations: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  extraEnv: {}
  limits:
    cpu: "1"
    memory: 512Mi

service:
  name: mirrord-share-ingress
  type: ClusterIP
  # Service port your ingress routes to. Forwards to the container's `server.port`.
  port: 80

sa:
  create: true
  name: mirrord-share-ingress
