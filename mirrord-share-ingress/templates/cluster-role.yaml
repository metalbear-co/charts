apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app: mirrord-share-ingress
    {{- include "mirrord-share-ingress.labels" . | nindent 4 }}
  name: mirrord-share-ingress
rules:
# Watches previews and mirrord sessions cluster-wide to map share hosts to targets. A session
# records its share link in its status.
- apiGroups: [preview.mirrord.metalbear.co]
  resources: [previewsessions]
  verbs: [get, list, watch]
- apiGroups: [mirrord.metalbear.co]
  resources: [mirrordclustersessions]
  verbs: [get, list, watch]
