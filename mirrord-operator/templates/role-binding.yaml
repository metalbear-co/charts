apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: mirrord-operator-apiserver-authentication
  namespace: kube-system
  {{- if .Values.operator.annotations }}
  annotations:
    {{- include "mirrord-operator.annotations" . | nindent 4 }}
  {{- end }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: mirrord-operator-apiserver-authentication
subjects:
- kind: ServiceAccount
  name: {{ .Values.sa.name }}
  namespace: {{ .Values.namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: mirrord-operator
  namespace: {{ .Values.namespace }}
  {{- if .Values.operator.annotations }}
  annotations:
    {{- include "mirrord-operator.annotations" . | nindent 4 }}
  {{- end }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: mirrord-operator
subjects:
- apiGroup: ''
  kind: ServiceAccount
  name: {{ .Values.sa.name }}
  namespace: {{ .Values.namespace }}
