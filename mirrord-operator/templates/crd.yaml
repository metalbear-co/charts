apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: mirrordpolicies.policies.mirrord.metalbear.co
spec:
  group: policies.mirrord.metalbear.co
  names:
    categories:
    - mirrord
    kind: MirrordPolicy
    plural: mirrordpolicies
    singular: mirrordpolicy
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - description: Whether every rule in this policy is enforceable.
      jsonPath: .status.conditions[?(@.type=="Accepted")].status
      name: Accepted
      type: string
    - description: Why part of this policy is not enforced.
      jsonPath: .status.conditions[?(@.type=="Accepted")].reason
      name: Reason
      type: string
    - description: Which rules are not enforced.
      jsonPath: .status.conditions[?(@.type=="Accepted")].message
      name: Detail
      priority: 1
      type: string
    - description: Time since the resource was created.
      jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha
    schema:
      openAPIV3Schema:
        description: Auto-generated derived type for MirrordPolicySpec via `CustomResource`
        properties:
          spec:
            description: |-
              Custom resource for policies that limit what mirrord features users can use.

              This policy applies only to resources living in the same namespace.
            properties:
              appliesToCopyTargets:
                default: false
                description: |-
                  Whether this policy applies also to sessions using the copy target feature.

                  By default, policies don't apply to copy target sessions.

                  Defaults to `false`.
                type: boolean
              block:
                description: List of features and operations blocked by this policy.
                items:
                  description: Features and operations that can be blocked by `mirrordpolicies` and `mirrordclusterpolicies`.
                  enum:
                  - steal
                  - steal-without-filter
                  - mirror
                  - copy-target-scale-down
                  type: string
                type: array
              env:
                default:
                  exclude: []
                description: |-
                  Controls how mirrord-operator handles user requests to fetch environment variables from the
                  target.
                properties:
                  exclude:
                    default: []
                    description: |-
                      List of environment variables that should be excluded when using mirrord.

                      These environment variables won't be retrieved from the target even if the user
                      specifies them in their `feature.env.include` mirrord config.

                      Variable names can be matched using `*` and `?` where `?` matches exactly one occurrence of
                      any character and `*` matches arbitrary many (including zero) occurrences of any character,
                      e.g. `DATABASE_*` will match `DATABASE_URL` and `DATABASE_PORT`.
                    items:
                      type: string
                    type: array
                type: object
              fs:
                default:
                  readOnly: []
                  local: []
                  notFound: []
                description: |-
                  Overrides fs ops behaviour, granting control over them to the operator policy, instead of
                  the user config.
                properties:
                  local:
                    default: []
                    description: |-
                      Files that cannot be opened at all.

                      Opening the file will be rejected and mirrord will open the file locally instead.
                    items:
                      type: string
                    type: array
                  notFound:
                    default: []
                    description: |-
                      Files that cannot be opened at all.

                      Opening the file is rejected with an IO error.
                    items:
                      type: string
                    type: array
                  readOnly:
                    default: []
                    description: |-
                      Files that cannot be opened for writing.

                      Opening the file for writing is rejected with an IO error.
                    items:
                      type: string
                    type: array
                type: object
              network:
                default:
                  incoming:
                    httpFilter:
                      headerFilter: null
                  outgoing:
                    allow: []
                    block: []
                description: |-
                  Fine grained control over network features like specifying required HTTP filters and
                  limiting outgoing connections.
                properties:
                  incoming:
                    default:
                      httpFilter:
                        headerFilter: null
                    description: Incoming network operations policy that partially mimics the mirrord `network.incoming` config.
                    properties:
                      httpFilter:
                        default:
                          headerFilter: null
                        description: Http filter policy that allows to specify requirements for the HTTP filter used in a session.
                        properties:
                          headerFilter:
                            description: |-
                              Require the user's header filter to match this regex, if such filter is provided.

                              This auto enables `steal-without-filter` policy block to require that the user specifies a
                              header filter for the network steal feature.

                              # Composed filters

                              When the user requests an `all_of` HTTP filter, at least one of the nested filters
                              must be a header filter that matches this regex. At least one nested filter is required.

                              When the user requests an `any_of` HTTP filter, all nested header filters must match this
                              regex. At least one nested header filter is required.
                            nullable: true
                            type: string
                        type: object
                    type: object
                  outgoing:
                    default:
                      allow: []
                      block: []
                    description: Outgoing network operations policy that partially mimics the mirrord `network.outgoing` config.
                    properties:
                      allow:
                        default: []
                        description: |-
                          List of allowed outgoing connections.
                          If specified, only connections matching these rules will be permitted.
                          Evaluated before `block` rules, so a connection that matches both will be blocked.
                        items:
                          description: A rule describing outgoing network connections (for either allow or block lists).
                          properties:
                            hostname:
                              description: Regex pattern for matching hostnames.
                              nullable: true
                              type: string
                            ipBlock:
                              description: IP-based destination rules.
                              nullable: true
                              properties:
                                cidr:
                                  description: CIDR notation of the IP range (e.g., "10.0.0.0/16").
                                  type: string
                                except:
                                  default: []
                                  description: List of CIDR ranges to exclude from the IP range.
                                  items:
                                    type: string
                                  type: array
                              required:
                              - cidr
                              type: object
                            ports:
                              default: []
                              description: |-
                                List of ports and protocols this rule applies to.
                                If not specified, the rule applies to all ports.
                              items:
                                description: Port and protocol specification for outgoing connections.
                                properties:
                                  port:
                                    description: Port number.
                                    format: uint16
                                    maximum: 65535.0
                                    minimum: 0.0
                                    type: integer
                                  protocol:
                                    description: Network protocol (TCP or UDP).
                                    enum:
                                    - TCP
                                    - UDP
                                    type: string
                                required:
                                - port
                                - protocol
                                type: object
                              type: array
                          type: object
                        type: array
                      block:
                        default: []
                        description: |-
                          List of blocked outgoing connections.
                          If specified, connections matching these rules will be denied.
                          Evaluated after `allow` rules, so a connection that matches both will be blocked.
                        items:
                          description: A rule describing outgoing network connections (for either allow or block lists).
                          properties:
                            hostname:
                              description: Regex pattern for matching hostnames.
                              nullable: true
                              type: string
                            ipBlock:
                              description: IP-based destination rules.
                              nullable: true
                              properties:
                                cidr:
                                  description: CIDR notation of the IP range (e.g., "10.0.0.0/16").
                                  type: string
                                except:
                                  default: []
                                  description: List of CIDR ranges to exclude from the IP range.
                                  items:
                                    type: string
                                  type: array
                              required:
                              - cidr
                              type: object
                            ports:
                              default: []
                              description: |-
                                List of ports and protocols this rule applies to.
                                If not specified, the rule applies to all ports.
                              items:
                                description: Port and protocol specification for outgoing connections.
                                properties:
                                  port:
                                    description: Port number.
                                    format: uint16
                                    maximum: 65535.0
                                    minimum: 0.0
                                    type: integer
                                  protocol:
                                    description: Network protocol (TCP or UDP).
                                    enum:
                                    - TCP
                                    - UDP
                                    type: string
                                required:
                                - port
                                - protocol
                                type: object
                              type: array
                          type: object
                        type: array
                    type: object
                type: object
              profileAllowlist:
                description: |-
                  A list of allowed mirrord profiles.

                  If multiple policies apply to a session,
                  user's mirrord profile must be present in all allowlists.

                  Mind that mirrord profiles are only a functional feature.
                  mirrord Operator is not able to enforce that the
                  application running on the user's machine follows the selected profile.

                  This setting should not be used in order to prevent malicious actions.

                  Optional.
                items:
                  type: string
                nullable: true
                type: array
              requireProfile:
                default: false
                description: |-
                  Enforces that the user selects a mirrord profile for their session.

                  Mind that mirrord profiles are only a functional feature.
                  mirrord Operator is not able to enforce that the
                  application running on the user's machine follows the selected profile.

                  This setting should not be used in order to prevent malicious actions.

                  Defaults to `false`.
                type: boolean
              selector:
                description: |-
                  If specified in a policy, the policy will only apply to targets with labels that match all
                  of the selector's rules.
                nullable: true
                properties:
                  matchExpressions:
                    description: matchExpressions is a list of label selector requirements. The requirements are ANDed.
                    items:
                      description: |-
                        A label selector requirement is a selector that contains values, a key, and an operator that
                        relates the key and values.
                      properties:
                        key:
                          description: key is the label key that the selector applies to.
                          type: string
                        operator:
                          description: |-
                            operator represents a key's relationship to a set of values. Valid operators are In, NotIn,
                            Exists and DoesNotExist.
                          enum:
                          - In
                          - NotIn
                          - Exists
                          - DoesNotExist
                          type: string
                        values:
                          description: |-
                            values is an array of string values. If the operator is In or NotIn, the values array must
                            be non-empty. If the operator is Exists or DoesNotExist, the values array must be empty.
                            This array is replaced during a strategic merge patch.
                          items:
                            type: string
                          nullable: true
                          type: array
                      required:
                      - key
                      - operator
                      type: object
                    nullable: true
                    type: array
                  matchLabels:
                    additionalProperties:
                      type: string
                    description: |-
                      matchLabels is a map of {key,value} pairs. A single {key,value} in the matchLabels map is
                      equivalent to an element of matchExpressions, whose key field is "key", the operator is
                      "In", and the values array contains only "value". The requirements are ANDed.
                    nullable: true
                    type: object
                type: object
              splitQueues:
                default:
                  requireFilter: false
                description: |-
                  Requirements for the queue splitting message filters used in a session,
                  like requiring splitting with a filter for targets that have split queues configured.
                properties:
                  filters:
                    description: |-
                      Per-queue requirements for the message filters used in a session.

                      Every requirement whose `queueId` and `queueType` match a split queue of the session is
                      checked against that queue's message filter. Queues that the session splits without any
                      filter are exempt - they deliver no messages to the session.
                    items:
                      description: A message filter requirement for split queues matched by id and broker kind.
                      properties:
                        queueId:
                          description: |-
                            Regex matched against the ids of the queues split in a session, as they appear in the
                            target's split queues configuration and in the user's `feature.split_queues` mirrord
                            config. Use `^exact-id$` to match a single queue.
                          type: string
                        queueType:
                          description: Broker kind of the queues this requirement applies to.
                          enum:
                          - sqs
                          - kafka
                          - rmq
                          - googlePubSub
                          - azureServiceBus
                          - redisPubSub
                          - temporal
                          - bullMq
                          - unknown
                          type: string
                        rules:
                          default: {}
                          description: The message filter requirements for the matched queues.
                          properties:
                            allOf:
                              description: The queue's message filter must satisfy every one of these rules.
                              items:
                                description: A requirement on a single entry of a queue's message filter.
                                properties:
                                  key:
                                    description: Name of the message attribute/header the queue's message filter must contain.
                                    type: string
                                  pattern:
                                    description: |-
                                      Regex the filter pattern the user set for `key` must match.

                                      The user's filter pattern is itself a regex, and this regex is applied to it as a plain
                                      string. Use `^exact$` to demand one exact filter pattern. When unset, any filter pattern
                                      for `key` is accepted.
                                    nullable: true
                                    type: string
                                required:
                                - key
                                type: object
                              type: array
                            anyOf:
                              description: The queue's message filter must satisfy at least one of these rules.
                              items:
                                description: A requirement on a single entry of a queue's message filter.
                                properties:
                                  key:
                                    description: Name of the message attribute/header the queue's message filter must contain.
                                    type: string
                                  pattern:
                                    description: |-
                                      Regex the filter pattern the user set for `key` must match.

                                      The user's filter pattern is itself a regex, and this regex is applied to it as a plain
                                      string. Use `^exact$` to demand one exact filter pattern. When unset, any filter pattern
                                      for `key` is accepted.
                                    nullable: true
                                    type: string
                                required:
                                - key
                                type: object
                              type: array
                          type: object
                      required:
                      - queueId
                      - queueType
                      type: object
                    type: array
                  requireFilter:
                    default: false
                    description: |-
                      Require the session to split the target's configured queues.

                      When the target has split queues configured for some broker kind, the session must request
                      queue splitting for that kind, otherwise it is rejected. A split queue with no filter at
                      all is still accepted - such a queue delivers no messages to the session, so it does not
                      disturb the deployed workload or other users.

                      Defaults to `false`.
                    type: boolean
                type: object
              targetPath:
                description: |-
                  Specify the targets for which this policy applies, in the pod/my-pod deploy/my-deploy
                  notation. Targets can be matched using `*` and `?` where `?` matches exactly one
                  occurrence of any character and `*` matches arbitrary many (including zero) occurrences
                  of any character. If not specified, this policy does not depend on the target's path.
                nullable: true
                type: string
            required:
            - block
            type: object
          status:
            description: Whether the operator has observed a resource and put it into effect.
            nullable: true
            properties:
              conditions:
                items:
                  description: Condition contains details for one aspect of the current state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: lastTransitionTime is the last time the condition transitioned from one status to another. This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: message is a human readable message indicating details about the transition. This may be an empty string.
                      type: string
                    observedGeneration:
                      description: observedGeneration represents the .metadata.generation that the condition was set based upon. For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date with respect to the current state of the instance.
                      format: int64
                      type: integer
                    reason:
                      description: reason contains a programmatic identifier indicating the reason for the condition's last transition. Producers of specific condition types may define expected values and meanings for this field, and whether the values are considered a guaranteed API. The value should be a CamelCase string. This field may not be empty.
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              observedGeneration:
                format: int64
                nullable: true
                type: integer
            type: object
        required:
        - spec
        title: MirrordPolicy
        type: object
    served: true
    storage: true
    subresources:
      status: {}
