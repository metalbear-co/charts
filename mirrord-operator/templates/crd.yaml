                                  Only valid when `variable` is specified directly (not as a pattern).
                                  When the variable is absent and this is set, the fallback is used as the property value.
                                  The workload will still be patched to inject the variable with the split topic name.
                                nullable: true
                                type: string
                              variable:
                                description: Name of the variable.
                                type: string
                            required:
                            - container
                            - variable
                            type: object
                        type: object
                      type: array
                  required:
                  - clientConfig
                  - id
                  - nameSources
                  type: object
                type: array
            required:
            - consumerApiVersion
            - consumerKind
            - consumerName
            - topics
            type: object
          status:
            description: Whether the operator has observed a resource and put it into effect.
            nullable: true
