                          - kafka
                          - rmq
                          - googlePubSub
                          - azureServiceBus
                          - redisPubSub
                          - temporal
                          - bullMq
                          - unknown
                          type: string
                        rules:
                          default: {}
                          description: The message filter requirements for the matched queues.
                          properties:
                            allOf:
                              description: The queue's message filter must satisfy every one of these rules.
                              items:
                                description: A requirement on a single entry of a queue's message filter.
                                properties:
                                  key:
                                    description: Name of the message attribute/header the queue's message filter must contain.
                                    type: string
                                  pattern:
                                    description: |-
                                      Regex the filter pattern the user set for `key` must match.

                                      The user's filter pattern is itself a regex, and this regex is applied to it as a plain
                                      string. Use `^exact$` to demand one exact filter pattern. When unset, any filter pattern
                                      for `key` is accepted.
                                    nullable: true
                                    type: string
                                required:
                                - key
