kind: CustomResourceDefinition
metadata:
  name: mirrordtlsstealconfigs.mirrord.metalbear.co
spec:
  group: mirrord.metalbear.co
  names:
    categories:
    - mirrord
    kind: MirrordTlsStealConfig
    plural: mirrordtlsstealconfigs
    singular: mirrordtlsstealconfig
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - description: Whether every port in this configuration takes effect.
      jsonPath: .status.conditions[?(@.type=="Accepted")].status
      name: Accepted
      type: string
    - description: Why part of this configuration does not take effect.
      jsonPath: .status.conditions[?(@.type=="Accepted")].reason
      name: Reason
      type: string
    - description: Detail of the problem.
      jsonPath: .status.conditions[?(@.type=="Accepted")].message
      name: Detail
      priority: 1
      type: string
    - description: Time since the resource was created.
      jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha
    schema:
      openAPIV3Schema:
        description: Auto-generated derived type for MirrordTlsStealConfigSpec via `CustomResource`
        properties:
          spec:
            description: |-
              Custom resource for configuring how the mirrord-agent handles stealing TLS traffic from selected
              targets.

              Namespaced.
            properties:
              ports:
                description: Configuration for stealing TLS traffic, separate for each port.
                items:
                  description: Configures TLS setup for stealing traffic from some port.
                  properties:
                    agentAsClient:
                      description: |-
                        Configures how mirrord-agent authenticates itself and the server when acting as a TLS
                        client.

                        mirrord-agent acts as a TLS client when passing unmatched traffic to its original
                        destination.
                      properties:
                        authentication:
                          description: |-
                            Configures how mirrord-agent authenticates itself to the original destination server.

                            Optional. If not present, mirrord-agent will make connections anonymously.
                          nullable: true
                          properties:
                            certPem:
                              description: |-
                                Path to a PEM file containing a certificate chain to use.

                                This file must contain at least one certificate.
                                It can contain entries of other types, e.g private keys, which are ignored.
                              type: string
                            keyPem:
                              description: |-
                                Path to a PEM file containing a private key matching the certificate chain found in
                                `cert_pem`.

                                This file must contain exactly one private key.
                                It can contain entries of other types, e.g certificates, which are ignored.
                              type: string
                          required:
                          - certPem
                          - keyPem
                          type: object
                        verification:
                          description: Configures how mirrord-agent verifies the server's certificate.
                          properties:
                            acceptAnyCert:
                              description: |-
                                Whether to accept any certificate, regardless of its validity and who signed it.

                                Optional. Defaults to `false`.
                              type: boolean
                            trustRoots:
                              description: |-
                                Paths to PEM files and directories with PEM files containing allowed root certificates.

