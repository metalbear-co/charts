                    items:
                      description: Session-specific content for one file mounted from a `configMap` volume.
                      properties:
                        content:
                          description: The file's content with this session's output names swapped in.
                          type: string
                        file:
                          description: File path within the volume.
                          type: string
                        mountDirs:
                          description: |-
                            Directories the volume is mounted at across the target's containers,
                            resolved from the pod spec's volume mounts. The proxy matches reads of
                            this file under any of them.
                          items:
                            type: string
                          type: array
                        rewrite:
                          description: |-
                            Recipe for repeating the rewrite on a *different* base document than
                            the target's original file. A preview session that overrides the same
                            file through `config_mounts` applies it to the user-provided content,
                            so the user's values survive and only the queue names change -
                            [`Self::content`] cannot serve there because it is rendered from the
                            original file. Absent when nothing in this file resolved to an output.
                          nullable: true
                          properties:
                            outputs:
                              additionalProperties:
                                type: string
                              description: |-
                                Maps each original name read from this file to the name this session
                                should see (the session output, or the shared fallback for queues the
                                session does not override).
                              type: object
                            selectors:
                              description: |-
                                `valueSelector` expressions bound to this file, from the split config.
                                Empty for pattern and whole-file bindings, whose names are swapped by
                                text search instead.
                              items:
                                type: string
                              type: array
                          required:
                          - outputs
                          type: object
                        volume:
                          description: Volume name in the target's pod spec.
                          type: string
                      required:
                      - content
                      - file
                      - volume
                      type: object
                    type: array
                  tmpResources:
                    description: Temporary resources created for each queue, keyed by queue ID.
                    items:
                      properties:
                        channel:
                          additionalProperties:
                            type: string
                          description: |-
                            Maps original Redis channel name to temporary channel name.
                            One entry per physical channel managed under this queue_id.
                          type: object
                        queue:
                          additionalProperties:
                            type: string
                          description: |-
                            Maps original queue name to temporary queue name (RabbitMQ). One entry
                            per physical queue managed under this queue_id.
                          type: object
                        queueId:
                          description: Queue ID from MirrordSplitConfig.
                          type: string
                        subscription:
                          additionalProperties:
                            type: string
                          description: |-
                            Maps original subscription name to temporary subscription name.
                            One entry per physical subscription managed under this queue_id.
                          type: object
                        taskQueue:
                          additionalProperties:
                            type: string
                          description: Maps original Temporal task queue name to virtual task queue name.
                          type: object
                        topic:
                          additionalProperties:
                            type: string
                          description: |-
                            Maps original topic name to temporary topic name. One entry per
                            physical topic managed under this queue_id.
                          type: object
                      required:
                      - queueId
                      type: object
                    type: array
                type: object
              servingInstance:
                nullable: true
                type: string
              startError:
                properties:
                  code:
                    format: uint16
                    maximum: 65535.0
                    minimum: 0.0
                    type: integer
                  message:
                    type: string
                  reason:
                    type: string
                required:
                - code
                - message
                - reason
                type: object
              starting:
                properties:
                  start_time_utc:
                    type: string
                required:
                - start_time_utc
                type: object
            type: object
        required:
        - spec
        title: MirrordClusterSplitSession
        type: object
    selectableFields:
    - jsonPath: .status.phase
    served: true
    storage: true
    subresources:
      status: {}
{{ end }}
