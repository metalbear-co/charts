      jsonPath: .spec.consumerApiVersion
      name: Consumer API Version
      priority: 1
      type: string
    - description: Timeout for consumer workload restart.
      jsonPath: .spec.consumerRestartTimeout
      name: Consumer Restart Timeout
      priority: 1
      type: string
    - description: Whether this legacy configuration is still what the operator reads.
      jsonPath: .status.conditions[?(@.type=="Superseded")].status
      name: In Use
      type: string
    - description: Which resource replaced this one.
      jsonPath: .status.conditions[?(@.type=="Superseded")].message
      name: Detail
      priority: 1
      type: string
