        description: Auto-generated derived type for MirrordSplitConfigSpec via `CustomResource`
        properties:
          spec:
            description: |-
              Unified queue splitting configuration for a single workload.

              Replaces per-broker CRDs (`MirrordWorkloadQueueRegistry`, `MirrordKafkaTopicsConsumer`) with a
              single resource that covers SQS, Kafka, RabbitMQ, Google Cloud Pub/Sub, and future broker
              types.

              There must be at most one `MirrordSplitConfig` per workload. If the operator discovers
              duplicates targeting the same workload, it fails the session rather than guessing.
            properties:
              clientConfigs:
                description: |-
                  Default broker client configuration per queue kind. Each field holds the name of a
                  `MirrordPropertyList`, resolved in this resource's namespace first and, when not
                  found there, in the operator's namespace.
                nullable: true
                properties:
                  azureServiceBus:
                    nullable: true
                    type: string
