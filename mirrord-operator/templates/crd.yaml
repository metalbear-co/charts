                              type: array
                            anyOf:
                              description: The queue's message filter must satisfy at least one of these rules.
                              items:
                                description: A requirement on a single entry of a queue's message filter.
                                properties:
                                  key:
                                    description: Name of the message attribute/header the queue's message filter must contain.
                                    type: string
                                  pattern:
                                    description: |-
                                      Regex the filter pattern the user set for `key` must match.

                                      The user's filter pattern is itself a regex, and this regex is applied to it as a plain
                                      string. Use `^exact$` to demand one exact filter pattern. When unset, any filter pattern
                                      for `key` is accepted.
                                    nullable: true
                                    type: string
                                required:
                                - key
                                type: object
                              type: array
                          type: object
                      required:
                      - queueId
                      - queueType
                      type: object
                    type: array
                  requireFilter:
                    default: false
                    description: |-
                      Require the session to split the target's configured queues.

                      When the target has split queues configured for some broker kind, the session must request
                      queue splitting for that kind, otherwise it is rejected. A split queue with no filter at
                      all is still accepted - such a queue delivers no messages to the session, so it does not
                      disturb the deployed workload or other users.

                      Defaults to `false`.
                    type: boolean
                type: object
              targetPath:
                description: |-
                  Specify the targets for which this policy applies, in the pod/my-pod deploy/my-deploy
                  notation. Targets can be matched using `*` and `?` where `?` matches exactly one
                  occurrence of any character and `*` matches arbitrary many (including zero) occurrences
                  of any character. If not specified, this policy does not depend on the target's path.
